name: Release Worldmeter

on:
  push:
    branches: [main]
    paths:
      - 'krisenradar-card.js'
      - 'package.json'
      - 'scripts/build.mjs'
      - 'scripts/package.py'
      - 'src/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldmeter-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build card and package
        run: |
          node scripts/build.mjs
          node --check krisenradar-card.js
          python3 scripts/package.py
      - name: Publish normal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release version must be a normal x.y.z version.'
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping the published release unchanged."
            exit 0
          fi
          gh release create "$tag" \
            krisenradar-card.js \
            "artifacts/ha-worldmeter-$version.zip" \
            artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Worldmeter $version – Krisenradar Demo" \
            --notes-file "docs/RELEASE_NOTES_$version.md" \
            --latest
